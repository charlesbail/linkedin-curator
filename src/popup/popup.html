<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aufwieder-zen</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <span class="popup__logo" aria-hidden="true">A</span>
        <div class="popup__heading">
          <h1 class="popup__title">Aufwieder-zen</h1>
          <p class="popup__subtitle" id="popup-subtitle">LinkedIn feed controls</p>
        </div>
      </header>

      <section class="popup__card" id="feed-settings" aria-label="Feed settings">
        <div class="popup__row">
          <div class="popup__row-text">
            <label class="popup__row-label" id="buttons-label" for="buttons-toggle">Enable Buttons in Feed</label>
            <p class="popup__row-desc" id="buttons-desc">Show Unfollow and Block on posts</p>
          </div>
          <button
            type="button"
            role="switch"
            id="buttons-toggle"
            class="switch"
            aria-checked="false"
          >
            <span class="switch__thumb"></span>
          </button>
        </div>

        <div class="popup__divider"></div>

        <div class="popup__row">
          <div class="popup__row-text">
            <label class="popup__row-label" id="original-author-label" for="original-author-block-toggle">
              Block on Original Author
            </label>
            <p class="popup__row-desc" id="original-author-desc">Show Block on the original author of a repost or like</p>
          </div>
          <button
            type="button"
            role="switch"
            id="original-author-block-toggle"
            class="switch"
            aria-checked="false"
          >
            <span class="switch__thumb"></span>
          </button>
        </div>

        <div class="popup__divider"></div>

        <div class="popup__row">
          <div class="popup__row-text">
            <label class="popup__row-label" id="toolbar-order-label" for="toolbar-order-toggle">Reverse Toolbar Order</label>
            <p class="popup__row-desc" id="toolbar-order-desc">Swap the two button groups</p>
          </div>
          <button
            type="button"
            role="switch"
            id="toolbar-order-toggle"
            class="switch"
            aria-checked="false"
          >
            <span class="switch__thumb"></span>
          </button>
        </div>

        <div class="popup__divider"></div>

        <div class="popup__row">
          <div class="popup__row-text">
            <label class="popup__row-label" id="debug-label" for="debug-toggle">Debug Mode</label>
            <p class="popup__row-desc" id="debug-desc">Show console logs and helpers</p>
          </div>
          <button type="button" role="switch" id="debug-toggle" class="switch" aria-checked="false">
            <span class="switch__thumb"></span>
          </button>
        </div>

        <div class="popup__divider"></div>

        <div class="popup__row">
          <div class="popup__row-text">
            <span class="popup__row-label" id="language-label">Language</span>
            <p class="popup__row-desc" id="language-desc">Language of the popup and feed buttons</p>
          </div>
          <div class="popup__segment" role="radiogroup" aria-labelledby="language-label">
            <button type="button" class="popup__segment-btn" role="radio" id="language-en" data-locale="en" aria-checked="true">
              EN
            </button>
            <button type="button" class="popup__segment-btn" role="radio" id="language-fr" data-locale="fr" aria-checked="false">
              FR
            </button>
          </div>
        </div>
      </section>

      <footer class="popup__footer">
        <p class="popup__counter">
          <span id="blocked-count-label">Blocked profiles</span>
          <span class="popup__counter-value" id="blocked-profile-count">0</span>
        </p>
        <a
          class="popup__link"
          href="https://www.linkedin.com/mypreferences/d/manage-by-blocked-list"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span id="view-blocked-label">View Blocked Profiles</span>
          <span class="popup__link-arrow" aria-hidden="true">&rarr;</span>
        </a>
      </footer>
    </main>
    <script type="module" src="popup.ts"></script>
  </body>
</html>
